services:
  diagnostic:
    build:
      context: .
      dockerfile: Dockerfile
    image: diagnostic-tool:local
    container_name: diagnostic-tool
    # Default command matches the Dockerfile's CMD; override per-run, e.g.:
    #   docker compose run --rm diagnostic system
    #   docker compose run --rm diagnostic network example.com
    #   docker compose run --rm diagnostic disk
    command: ["help"]
